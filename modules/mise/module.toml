description = "Polyglot dev-environment runtime version manager with config"
[packages]
present = [
  "mise", # The front-end to your dev env
]

[dotfiles]
"~/.config/mise/config.toml" = { source = "home/.config/mise/config.toml", mode = "symlink" }
"~/.config/mise/tasks" = { source = "home/.config/mise/tasks", mode = "symlink-each" }
