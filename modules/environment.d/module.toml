description = "environment.d drop-ins for GPU, HDR, gaming and toolkit variables"
[dotfiles]
"~/.config/environment.d/" = { source = "home/.config/environment.d/", mode = "symlink-each" }

[hooks]
post = [
  '''
  set -a;
  for f in "$HOME"/.config/environment.d/*.conf;
    do . "$f";
  done;
  set +a;
  systemctl --user import-environment;
  dbus-update-activation-environment --all;
  if command -v niri >/dev/null 2>&1;
    then niri msg action load-config-file || true;
  fi
  ''',
]
