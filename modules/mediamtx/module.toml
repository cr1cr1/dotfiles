[packages]
present = [
  "ffmpeg", # Complete solution to record, convert and stream audio and video
  "aur/mediamtx-bin", # Ready-to-use and zero-dependency real-time media server and media proxy that allows to publish, read, proxy, record and playback video and audio streams
]

[dotfiles]
"~/.config/systemd/user/mediamtx.service" = { source = "home/.config/systemd/user/mediamtx.service", mode = "copy" }
"~/.config/mediamtx.yml" = { source = "home/.config/mediamtx.yml", mode = "symlink" }

[hooks]
post = [
  "systemctl --user daemon-reload",
]
