description = "Text, document and data processing tools (JSON, HTML, XML, CSV, image and large-text utilities)"
[packages]
present = [
  "jq", # Command-line JSON processor
  "graphicsmagick", # Image processing system
  "htmlq", # Like jq, but for HTML
  "jless", # A command-line pager for JSON data
  "aur/pandoc-bin", # Conversion between documentation formats
  "tabiew", # A lightweight TUI to view and query CSV files
  "figlet", # A program for making large letters out of ordinary text
  "pugixml", # Light-weight, simple and fast XML parser for C++ with XPath support
]
