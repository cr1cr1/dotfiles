description = "DeepSeek Harness"

[tools]
"bun" = "latest"

[hooks]
post = [
  "bun install --global @deepseek-ai/dsh"
]

[dotfiles]
"~/.dsh/catppuccin-state.json" = { source = "home/.dsh/catppuccin-state.json", mode = "symlink" }
"~/.dsh/settings.yaml" = { source = "home/.dsh/settings.yaml", mode = "copy" }
