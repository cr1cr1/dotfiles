description = "System-wide Btrfs snapshot management with snapper configs for root and home"
scope = "system"

[packages]
present = [
  "snapper",
]

[dotfiles]
"/etc/snapper/configs/home" = { source = "home/etc/snapper/configs/home", mode = "copy" }
"/etc/snapper/configs/root" = { source = "home/etc/snapper/configs/root", mode = "copy" }

[hooks]
post = [
  "sudo systemctl restart snapperd",
  "sudo systemctl enable --now snapper-timeline.timer",
  "sudo systemctl enable --now snapper-cleanup.timer",
  "sudo systemctl enable --now snapper-boot.timer",
]
