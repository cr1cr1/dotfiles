description = "Backup and sync tooling (rclone, syncthing) plus pacman btrfs snapshots via snap-pac"
[packages]
present = [
  "rclone", # Sync files to and from Google Drive, S3, Swift, Cloudfiles, Dropbox and Google Cloud Storage
  "snap-pac", # Pacman hooks that use snapper to create pre/post btrfs snapshots like openSUSE's YaST
  "syncthing", # Open Source Continuous Replication / Cluster Synchronization Thing
]
