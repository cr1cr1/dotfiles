description = "Systemd automount+mount units for Synology NAS NFS shares (syn01, syn02, shared) with enable hooks"
scope = "system"

[dotfiles]
"/usr/local/lib/systemd/system/mnt-synology-syn01.mount" = { source = "usr/local/lib/systemd/system/mnt-synology-syn01.mount", mode = "copy" }
"/usr/local/lib/systemd/system/mnt-synology-syn01.automount" = { source = "usr/local/lib/systemd/system/mnt-synology-syn01.automount", mode = "copy" }
"/usr/local/lib/systemd/system/mnt-synology-syn02.mount" = { source = "usr/local/lib/systemd/system/mnt-synology-syn02.mount", mode = "copy" }
"/usr/local/lib/systemd/system/mnt-synology-syn02.automount" = { source = "usr/local/lib/systemd/system/mnt-synology-syn02.automount", mode = "copy" }
"/usr/local/lib/systemd/system/mnt-synology-shared.mount" = { source = "usr/local/lib/systemd/system/mnt-synology-shared.mount", mode = "copy" }
"/usr/local/lib/systemd/system/mnt-synology-shared.automount" = { source = "usr/local/lib/systemd/system/mnt-synology-shared.automount", mode = "copy" }

[hooks]
post = [
  "sudo systemctl daemon-reload",

  "sudo mkdir -p /mnt/synology/syn01",
  "sudo systemctl enable --now mnt-synology-syn01.automount || true",

  "sudo mkdir -p /mnt/synology/syn02",
  "sudo systemctl enable --now mnt-synology-syn02.automount || true",

  "sudo mkdir -p /mnt/synology/shared",
  "sudo systemctl enable --now mnt-synology-shared.automount || true",
]
