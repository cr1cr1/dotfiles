CustomProxyLocation=
Enabled=true
SearchInAllDatabases=true

[FdoSecrets]
ConfirmAccessItem=false
Enabled=true
ShowNotification=false

[GUI]
ApplicationTheme=classic
ColorPasswords=false
CompactMode=true
HidePreviewPanel=false
MinimizeOnClose=true
MinimizeOnStartup=false
MinimizeToTray=true
ShowTrayIcon=true
ToolButtonStyle=0
TrayIconAppearance=monochrome-dark

[KeeShare]
Active="<?xml version=\"1.0\"?><KeeShare><Active/></KeeShare>\n"
QuietSuccess=true

[PasswordGenerator]
AdditionalChars=
ExcludedChars=
Length=16
SpecialChars=true

[SSHAgent]
Enabled=true

[Security]
ClearClipboardTimeout=60
LockDatabaseIdle=false
LockDatabaseIdleSeconds=3600
LockDatabaseScreenLock=false
