[General]
AutoSaveAfterEveryChange=true
AutoSaveNonDataChanges=true
AutoSaveOnExit=true
BackupBeforeSave=true
BackupFilePathPattern=/mnt/win/c/Work/{DB_FILENAME}.kdbx
ConfigVersion=2
MinimizeAfterUnlock=true
NumberOfRememberedLastDatabases=3
UseAtomicSaves=false

[Browser]
