description = "SSH passphrase prompts, GPG key management (Kleopatra), and KWallet credential store"
scope = "system"

[packages]
present = [
  "x11-ssh-askpass", # Lightweight passphrase dialog for SSH
  "gcr", # A library for bits of crypto UI and parsing
  "pinentry", # Collection of simple PIN or passphrase entry dialogs which utilize the Assuan protocol
  "kleopatra", # Certificate Manager and Unified Crypto GUI
  "ksshaskpass", # ssh-add helper that uses kwallet and kpassworddialog
  "kwalletmanager", # Wallet management tool
]

[dotfiles]
"/etc/security/faillock.conf/deny" = { line = "deny = 10" }
"/etc/security/faillock.conf/unlock_time" = { line = "unlock_time = 300" }
