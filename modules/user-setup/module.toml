# Idempotent user setup tasks from pimp-my-cachyos
# mise-tasks/ (containerd excluded: disabled upstream),
# invoked as profile mise tasks in all.sh order.

[hooks]
post = [
  "env MISE_TRUSTED_CONFIG_PATHS=\"$PWD\" mise run user:shell",
  "env MISE_TRUSTED_CONFIG_PATHS=\"$PWD\" mise run env-reload",
  "env MISE_TRUSTED_CONFIG_PATHS=\"$PWD\" mise run user:cleanup",
]
