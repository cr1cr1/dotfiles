description = "Fresh text editor with Catppuccin Mocha theme"
[packages]
present = [
    "aur/fresh-editor-bin"
]

[dotfiles]
"~/.config/fresh/config.json" = { source = "home/.config/fresh/config.json", mode = "symlink" }
"~/.config/fresh/themes/catppuccin-mocha.json" = { source = "home/.config/fresh/themes/catppuccin-mocha.json", mode = "symlink" }
