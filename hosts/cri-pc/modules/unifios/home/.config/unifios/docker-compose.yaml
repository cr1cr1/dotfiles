name: unifios

services:
  unifi-os-server:
    container_name: unifi-os-server
    image: ghcr.io/unihosted/unifi-os-server-docker:latest
    cgroup: host
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "8080:8080" # HTTP inform / redirect
      - "8443:8443" # UniFi Controller API
    #   - "8444:8444" # Secure Portal for Hotspot
      - "8880-8882:8880-8882" # Hotspot portal redirection (HTTP)
      - "10003:10003/udp" # UniFi discovery (Only needed on local network)
      - "11443:443" # UniFi Web UI (HTTPS)
    #   - "3478:3478/udp" # STUN used for device poking
    #   - "5514:5514/udp" # Syslog
    #   - "6789:6789" # Speed test
    #   - "127.0.0.1:5432:5432" # PostgreSQL (localhost only)
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${UNIFIOS_DATA_DIR:-./data}:/var/lib/uosserver
      - ${UNIFIOS_DATA_DIR:-./data}:/var/lib/unifi
      # local default: appliance chowns /data/postgresql on boot; NFS root-squash blocks chown (EPERM)
      - ${UNIFIOS_DATA_DIR:-./data}:/data
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/log/journal
      - /var/opt/unifi/tmp:size=64m
      - /data/unifi-core/config/http
    networks:
      unifi-os-server-network:
        ipv4_address: 172.200.1.10
    # depends_on:
    #   - unifi-os-server-mongodb
    environment:
      TZ: Europe/Bucharest
      UOS_SYSTEM_IP: "127.0.0.1" # set to the LAN IP (10.3.67.5) if devices must adopt over L3
      MONGO_INTERNAL: "true"

  # unifi-os-server-mongodb:
  #   container_name: unifi-os-server-mongodb
  #   image: mongo:4.4
  #   restart: unless-stopped
  #   networks:
  #     unifi-os-server-network:
  #       ipv4_address: 172.200.1.11
  #   volumes:
  #     - ${UNIFIOS_DATA_DIR:-./data}:/data/db

networks:
  unifi-os-server-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.200.1.0/24
